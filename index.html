<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변승주</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1a0a2e, #3d1e6d, #8b3a62);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            cursor: pointer;
        }

        .info {
            position: absolute;
            top: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .message {
            position: absolute;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            animation: fadeOut 2s forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px);
            }
        }
    </style>
</head>
<body>
    <div class="info">사랑해</div>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let hearts = [];
        let particles = [];

        // 하트 그리기 함수
        function drawHeart(x, y, size, rotation, color, glow) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.scale(size, size);
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-15, -15, -30, -5, -30, 10);
            ctx.bezierCurveTo(-30, 20, -20, 30, 0, 45);
            ctx.bezierCurveTo(20, 30, 30, 20, 30, 10);
            ctx.bezierCurveTo(30, -5, 15, -15, 0, 0);
            ctx.closePath();
            
            if (glow) {
                ctx.shadowBlur = 30;
                ctx.shadowColor = color;
            }
            
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        // 하트 객체 생성
        class Heart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 1.5;
                this.rotation = 0;
                this.rotationSpeed = 0.01;
                this.scale = 1;
                this.targetScale = 1;
                this.brightness = 1;
                this.targetBrightness = 1;
                this.pulse = 0;
            }

            update() {
                this.rotation += this.rotationSpeed;
                this.scale += (this.targetScale - this.scale) * 0.1;
                this.brightness += (this.targetBrightness - this.brightness) * 0.1;
                this.pulse += 0.05;
                
                // 심장 박동 효과
                const beat = Math.sin(this.pulse) * 0.05 + 1;
                this.currentSize = this.size * this.scale * beat;
            }

            draw() {
                const color = `rgba(255, ${Math.floor(50 + this.brightness * 50)}, ${Math.floor(100 + this.brightness * 100)}, ${this.brightness})`;
                drawHeart(this.x, this.y, this.currentSize, this.rotation, color, true);
            }

            beat() {
                this.targetScale = 1.4;
                this.targetBrightness = 1.5;
                this.rotationSpeed = 0.05;
                
                setTimeout(() => {
                    this.targetScale = 1;
                    this.targetBrightness = 1;
                    this.rotationSpeed = 0.01;
                }, 300);

                // 하트 파티클 생성
                for (let i = 0; i < 20; i++) {
                    particles.push(new HeartParticle(this.x, this.y));
                }
            }
        }

        // 하트 파티클 클래스
        class HeartParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.size = Math.random() * 0.3 + 0.2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; // 중력 효과
                this.life -= this.decay;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                const alpha = this.life;
                const color = `rgba(255, 100, 150, ${alpha})`;
                drawHeart(this.x, this.y, this.size, this.rotation, color, false);
            }
        }

        // 중앙에 하트 생성
        const mainHeart = new Heart(canvas.width / 2, canvas.height / 2);
        hearts.push(mainHeart);

        // 클릭 이벤트
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 하트 두근두근
            hearts.forEach(heart => {
                heart.beat();
            });
            
            // 메시지 표시
            const message = document.createElement('div');
            message.className = 'message';
            message.textContent = '사랑해';
            message.style.left = x + 'px';
            message.style.top = y + 'px';
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 2000);
        });

        // 애니메이션 루프
        function animate() {
            ctx.fillStyle = 'rgba(26, 10, 46, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 하트 업데이트 및 그리기
            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });

            // 파티클 업데이트 및 그리기
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // 창 크기 조절 시
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            hearts[0].x = canvas.width / 2;
            hearts[0].y = canvas.height / 2;
        });
    </script>
</body>
</html>
